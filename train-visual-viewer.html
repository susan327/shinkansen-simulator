<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v74.3.3-alpha11-stage3 車体設計ツール</title><link rel="stylesheet" href="css/train-visual-viewer.css?v=74.4.3-alpha21-route-strip-step2x-mobile2"></head>
<body><canvas id="viewerCanvas"></canvas>
<header class="viewer-header"><div><h1>車体設計ツール <span class="badge">v74.3.3-alpha11-stage3</span></h1><span>安全範囲のパラメータで共通車両モデルをリアルタイム編集</span></div><a href="index.html">本編へ戻る</a></header>
<aside class="viewer-panel">
<section><h2>表示モデル</h2><div class="button-grid four"><button data-model="lead">先頭車</button><button data-model="middle">中間車</button><button data-model="tail">後部車</button><button data-model="consist" class="active">4両</button></div></section>
<section><h2>視点</h2><div class="button-grid"><button data-view="front">正面</button><button data-view="side">側面</button><button data-view="three">斜め前</button><button data-view="rear">後方</button><button data-view="top">上面</button><button data-view="low">床下</button></div></section>
<section class="designer-section"><h2>車体設計</h2><div id="designerControls"></div><canvas id="sectionCanvas"></canvas><div id="designWarnings" class="design-warnings"></div><div class="design-actions"><button id="resetDesign">初期値</button><button id="copyDesign">JSONコピー</button><button id="downloadDesign">保存</button><label class="file-button">読込<input id="importDesign" type="file" accept="application/json"></label></div></section>
<section><h2>部品表示</h2><label class="toggle">車体<input id="showBody" type="checkbox" checked></label><label class="toggle">窓<input id="showWindows" type="checkbox" checked></label><label class="toggle">ライン<input id="showStripe" type="checkbox" checked></label><label class="toggle">ドア<input id="showDoors" type="checkbox" checked></label><label class="toggle">スカート<input id="showSkirt" type="checkbox" checked></label><label class="toggle">ライト<input id="showLights" type="checkbox" checked></label><label class="toggle">台車・車輪<input id="showBogie" type="checkbox" checked></label><label class="toggle">床下機器<input id="showUnderfloor" type="checkbox" checked></label><label class="toggle">遮蔽構造<input id="showShield" type="checkbox" checked></label></section>
<section><h2>確認補助</h2><label class="toggle">線路・グリッド<input id="showRail" type="checkbox" checked></label><label class="toggle">ホーム<input id="showPlatform" type="checkbox"></label><label class="toggle">ワイヤーフレーム<input id="wireframe" type="checkbox"></label><label class="toggle">背景<select id="background"><option value="sky">空色</option><option value="white">白</option><option value="dark">暗色</option></select></label></section>
<section><h2>寸法</h2><div id="metrics" class="metrics"></div></section>
</aside><div class="help">ドラッグ：回転　ホイール：ズーム　｜　スライダー変更は3Dへ即反映</div>
